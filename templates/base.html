<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> {% block title %} {% endblock title %} - MyTodo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="{{ url_for('static', filename='js/test.js') }}"></script>
    <style>
  body.dark-mode {
    background-color: #121212;
    color: #ffffff;
  }

  .dark-mode .navbar,
  .dark-mode .card,
  .dark-mode .form-control,
  .dark-mode .btn {
    background-color: #1e1e1e;
    color: #ffffff;
    border-color: #444;
  }
</style>
  
  </head>
  <body>
    <button class="btn btn-sm btn-outline-light ms-2" onclick="toggleDarkMode()">🌙</button>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid ">
    <a class="navbar-brand " href="/">MyToDo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
        </li>
        </ul>
      </ul>
      <form class="d-flex" role="search" action="{{ url_for('search') }}" method="GET">
        <input class="form-control me-2 bg-body-tertiary" type="search" placeholder="Search" aria-label="Search" name="query"/>
        <button class="btn btn-outline-dark" type="submit">Search</button>
      </form>
    </div>
  </div>
        </nav>  
    
        {% block body %}

        {% endblock body %}

       <script>
        
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
      }
      
     
      

    </script>
      </body> 
</html>
